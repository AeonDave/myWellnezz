[tool.poetry]
name = "mywellnezz"
version = "2.2.0"
description = "View and register for gym sessions at fitness centers using the MyWellness app"
authors = ["AeonDave"]
readme = "README.md"
packages = [{ include = "mywellnezz" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
pillow = ">=12.1.1"
python-dateutil = ">=2.9"
httpx = ">=0.27"
keyring = ">=25"
platformdirs = ">=4"
textual = "^8.2.8"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
ruff = ">=0.8"
# PyInstaller caps its Python support per release: pick per interpreter range.
pyinstaller = [
    { version = ">=6", python = "<3.14" },
    { version = ">=6.16", python = ">=3.14" },
]
pytest-asyncio = "^1.5.0"

[tool.poetry.scripts]
mywellnezz = "mywellnezz.main:start"
build = "mywellnezz.build:install"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
